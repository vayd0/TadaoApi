<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tadao</title>
        <link
            href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Roboto", Arial, sans-serif;
            }
        </style>
    </head>
    <body>
        <section
            id="gallery-lignes"
            style="
                margin: auto;
                padding: 10px;
                max-height: 100vh;
                width: 80vw;
                overflow-y: scroll;
                overflow-x: hidden;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
                gap: 16px;
            "
        ></section>

        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                const res = await fetch("http://localhost:8000/api/routes");
                if (res.ok) {
                    const routes = await res.json();

                    const galleryLignes =
                        document.getElementById("gallery-lignes");
                    routes.forEach((route, index) => {
                        const card = document.createElement("a");
                        card.innerHTML = `<span>${route.route_short_name}</span>`;
                        card.style.backgroundColor = "#" + route.route_color;
                        card.style.color = "#" + route.route_text_color;
                        card.style.borderRadius =
                            5 + Math.floor(Math.random() * 20) + "px";
                        card.style.display = "flex";
                        card.style.alignItems = "center";
                        card.style.justifyContent = "center";
                        card.style.fontSize = "1rem";
                        card.style.textDecoration = "none";
                        card.style.boxShadow = "0 2px 8px rgba(0,0,0,0.1)";
                        card.style.height = "100%";
                        card.style.aspectRatio = "1 / 1";
                        card.style.animation = `${Math.random() * 0.7}s rotate infinite`;
                        card.style.tansition = "1s all ease-in-out";
                        const offset = Math.floor(Math.random() * 5) + 1;
                        if (offset % 2 === 1) {
                            card.style.marginTop = `${offset * 10}px`;
                        } else {
                            card.style.marginBottom = `${offset * 10}px`;
                        }

                        galleryLignes.appendChild(card);
                    });
                } else {
                    console.error("Erreur lors du chargement des données");
                }
            });
        </script>
        <style>
            @keyframes rotate {
                0% {
                    transform: rotate(0deg) scale(1);
                }
                50% {
                    transform: rotate(360deg) scale(2);
                }
                100% {
                    transform: rotate(0deg) scale(1);
                }
            }
        </style>
    </body>
</html>
